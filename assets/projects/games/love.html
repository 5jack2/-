<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix Confession</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;
            overflow-x: hidden;
            overflow-x: hidden;
            background-color: #000000;
            font-family: "Consolas", "Courier New", monospace;
        }

        html, body {
            max-width: 100vw;
            height: 100%;
        }

        #matrixCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            width: 100%;
            height: 100vh;
            height: 100%;
            z-index: 1;
        }

        .center-wrap {
            position: fixed;
            z-index: 10;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        .heart-shield {
            position: absolute;
            width: 460px;
            height: 420px;
            max-width: 78vw;
            max-height: 68vh;
            animation: heartbeat 1.5s ease-in-out infinite;
        }

        .heart-shield svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 22px #ff2266) drop-shadow(0 0 48px #ff4488);
        }

        .text-group {
            position: absolute;
            z-index: 20;
            text-align: center;
            pointer-events: none;
        }

        .main-text {
            font-size: clamp(15px, 2.8vw, 22px);
            line-height: 2.4;
            letter-spacing: 3px;
            padding: 0 30px;
            background: linear-gradient(90deg, #ff5088, #ff80aa, #ff3070, #ff5088);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            color: transparent;
            animation: textShine 5s linear infinite, textFadeIn 3s ease forwards;
            text-shadow: 0 0 40px rgba(255, 70, 120, 0.9);
            opacity: 0;
        }

        .love-text {
            font-size: clamp(26px, 5.5vw, 42px);
            font-weight: bold;
            letter-spacing: 6px;
            margin-top: 18px;
            background: linear-gradient(90deg, #ff2277, #ffcc00, #44ddff, #cc44ff, #ff2277);
            background-size: 400% 100%;
            -webkit-background-clip: text;
            color: transparent;
            animation: loveColor 2.5s linear infinite, lovePulse 1.8s ease-in-out infinite, textFadeIn 3.5s ease forwards;
            filter: drop-shadow(0 0 8px rgba(255, 34, 119, 0.9)) drop-shadow(0 0 16px rgba(68, 221, 255, 0.7));
            opacity: 0;
        }

        @keyframes heartbeat {
            0% { transform: scale(1); opacity: 0.75; }
            15% { transform: scale(1.07); opacity: 1; }
            30% { transform: scale(1); opacity: 0.75; }
            45% { transform: scale(1.11); opacity: 1; }
            75% { transform: scale(1); opacity: 0.75; }
        }

        @keyframes textFadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes textShine {
            0% { background-position: 0%; }
            100% { background-position: 300%; }
        }

        @keyframes loveColor {
            0% { background-position: 0%; }
            100% { background-position: 400%; }
        }

        @keyframes lovePulse {
            0%, 100% {
                transform: scale(1);
                filter: drop-shadow(0 0 8px rgba(255, 34, 119, 0.9)) drop-shadow(0 0 16px rgba(68, 221, 255, 0.7));
            }
            50% {
                transform: scale(1.08);
                filter: drop-shadow(0 0 12px rgba(255, 34, 119, 1)) drop-shadow(0 0 24px rgba(68, 221, 255, 0.95)) drop-shadow(0 0 36px rgba(204, 68, 255, 0.6));
            }
        }

        /* === 移动端适配 === */
        @media (max-width: 480px) {
            .heart-shield { width: 320px; height: 300px; }
            .main-text { font-size: clamp(12px, 3.5vw, 18px); line-height: 2; letter-spacing: 2px; padding: 0 20px; }
            .love-text { font-size: clamp(22px, 7vw, 36px); letter-spacing: 4px; margin-top: 12px; }
        }
        @media (max-width: 360px) {
            .heart-shield { width: 260px; height: 240px; max-height: 55vh; }
            .main-text { font-size: 11px; letter-spacing: 1px; padding: 0 12px; }
            .love-text { font-size: 22px; letter-spacing: 3px; }
        }
      canvas{max-width:100%;height:auto!important}
</style>
</head>
<body>
    <canvas id="matrixCanvas"></canvas>

    <div class="center-wrap">
        <div class="heart-shield">
            <svg viewBox="0 0 100 90" preserveAspectRatio="none">
                <defs>
                    <linearGradient id="heartStroke" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#ff2266" />
                        <stop offset="100%" stop-color="#ff77aa" />
                    </linearGradient>
                </defs>
                <path d="M50 88 C20 62 5 45 5 28 C5 12 18 0 35 0 C48 0 50 12 50 18 C50 12 52 0 65 0 C82 0 95 12 95 28 C95 45 80 62 50 88 Z" fill="none" stroke="url(#heartStroke)" stroke-width="1.6" />
            </svg>
        </div>

        <div class="text-group">
            <div class="main-text">
                世间万千代码，无数循环与逻辑<br>
                穿过矩阵无尽的比特洪流<br>
                过滤掉所有嘈杂的信号噪声<br>
                你的存在，是我程序里唯一的归宿
            </div>
            <div class="love-text">
                我喜欢你
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        const fontSize = 16;
        let columns;
        let drops = [];
        let baseSpeed = 2;
        let currentSpeed = baseSpeed;

        let fallHeartList = [];
        let burstHeartList = [];

        const heartColors = [
            '#ff3366',
            '#ff77aa',
            '#cc44ff',
            '#44ddff',
            '#ffaa33',
            '#ff5599',
            '#ff2277',
            '#8833ff'
        ];

        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;

            columns = Math.floor(width / fontSize);
            drops = [];

            for (let i = 0; i < columns; i++) {
                drops[i] = Math.random() * -height;
            }
        }

        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        window.addEventListener('mousemove', (e) => {
            const rate = e.clientX / width;
            currentSpeed = 1 + rate * 4;
        });

        window.addEventListener('click', (e) => {
            for (let i = 0; i < 60; i++) {
                const angle = Math.PI * 2 * Math.random();
                const speed = Math.random() * 6 + 2;

                burstHeartList.push({
                    x: e.clientX,
                    y: e.clientY,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    baseSize: Math.random() * 18 + 12,
                    sizePhase: Math.random() * Math.PI * 2,
                    rotate: Math.random() * 360,
                    rotateSpeed: (Math.random() - 0.5) * 8,
                    colorIndex: Math.floor(Math.random() * heartColors.length),
                    colorPhase: 0,
                    life: 1
                });
            }
        });

        function drawHeart(x, y, size, rotate, color, alpha) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(rotate * Math.PI / 180);
            ctx.globalAlpha = alpha;
            ctx.fillStyle = color;

            ctx.beginPath();
            ctx.moveTo(0, size * 0.3);
            ctx.bezierCurveTo(-size, -size * 0.4, -size, -size, 0, -size * 0.5);
            ctx.bezierCurveTo(size, -size, size, -size * 0.4, 0, size * 0.3);
            ctx.fill();

            ctx.restore();
        }

        function spawnFallHeart() {
            fallHeartList.push({
                x: Math.random() * width,
                y: -60,
                baseSize: Math.random() * 22 + 14,
                sizePhase: Math.random() * Math.PI * 2,
                vy: Math.random() * 1.6 + 0.8,
                vx: (Math.random() - 0.5) * 0.6,
                rotate: Math.random() * 360,
                rotateSpeed: (Math.random() - 0.5) * 2.2,
                colorIndex: Math.floor(Math.random() * heartColors.length),
                colorPhase: 0,
                life: 1
            });
        }

        function render() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.06)';
            ctx.fillRect(0, 0, width, height);

            for (let i = 0; i < columns; i++) {
                const char = String(Math.floor(Math.random() * 2));

                if (Math.random() < 0.08) {
                    ctx.fillStyle = Math.random() > 0.5 ? '#6098ff' : '#b466ff';
                } else {
                    ctx.fillStyle = '#00ff41';
                }

                ctx.font = fontSize + 'px Consolas';
                ctx.fillText(char, i * fontSize, drops[i] * fontSize);

                drops[i] += currentSpeed;

                if (drops[i] * fontSize > height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
            }

            if (Math.random() < 0.035) {
                spawnFallHeart();
            }

            for (let i = fallHeartList.length - 1; i >= 0; i--) {
                const h = fallHeartList[i];

                h.x += h.vx;
                h.y += h.vy;
                h.rotate += h.rotateSpeed;
                h.sizePhase += 0.06;
                h.colorPhase += 0.025;

                const realSize = h.baseSize + Math.sin(h.sizePhase) * 6;
                const cIdx = Math.floor((h.colorIndex + h.colorPhase) % heartColors.length);

                h.life -= 0.0025;

                if (h.life <= 0 || h.y > height + 80) {
                    fallHeartList.splice(i, 1);
                    continue;
                }

                drawHeart(h.x, h.y, realSize, h.rotate, heartColors[cIdx], h.life * 0.75);
            }

            for (let i = burstHeartList.length - 1; i >= 0; i--) {
                const bh = burstHeartList[i];

                bh.x += bh.vx;
                bh.y += bh.vy;
                bh.vy += 0.11;
                bh.vx *= 0.98;
                bh.rotate += bh.rotateSpeed;
                bh.sizePhase += 0.08;
                bh.colorPhase += 0.04;

                const realSize = bh.baseSize + Math.sin(bh.sizePhase) * 7;
                const cIdx = Math.floor((bh.colorIndex + bh.colorPhase) % heartColors.length);

                bh.life -= 0.017;

                if (bh.life <= 0) {
                    burstHeartList.splice(i, 1);
                    continue;
                }

                drawHeart(bh.x, bh.y, realSize, bh.rotate, currentColor, bh.life * 0.8);
            }

            requestAnimationFrame(render);
        }

        render();
    </script>
</body>
</html>
